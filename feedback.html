<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="version" content="0.06">
    <link rel="icon" type="image/png" href="tab.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;0,9..144,900&display=swap" rel="stylesheet">
    <title>Feedback - I Can't Afford A Therapist</title>
    <style>
        :root {
            --primary: #2a5c3f;
            --primary-dark: #1a3d2a;
            --accent: #c47a2a;
            --bg-white: #faf8f4;
            --bg-light: #f2ede6;
            --text-dark: #1c2b22;
            --text-light: #3f5447;
            --text-muted: #5a6e61;
            --border: #d5cec6;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        :focus { outline: none; }
        :focus-visible {
            outline: 3px solid var(--accent);
            outline-offset: 2px;
            border-radius: 3px;
        }

        body {
            font-family: 'Fraunces', Georgia, serif;
            font-size: 17px;
            line-height: 1.55;
            color: var(--text-dark);
            background: var(--bg-light);
        }

        .container { max-width: 600px; margin: 0 auto; padding: 20px; }

        header {
            background: var(--bg-white);
            border-bottom: 1px solid var(--border);
            padding: 36px 0 28px;
        }

        header h1 { font-size: 1.9em; font-weight: 900; color: var(--primary-dark); letter-spacing: -0.5px; }
        header p { color: var(--text-light); margin-top: 6px; }

        .back-link {
            display: inline-block;
            margin: 20px 0;
            color: var(--primary);
            text-decoration: underline;
            text-underline-offset: 3px;
            font-weight: 600;
        }

        .form-container {
            background: var(--bg-white);
            padding: 30px;
            border-radius: 6px;
            border: 1px solid var(--border);
        }

        .form-group { margin-bottom: 20px; }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--text-dark);
        }

        input, textarea, select {
            width: 100%;
            padding: 12px;
            border: 2px solid var(--border);
            border-radius: 6px;
            font-size: 16px;
            font-family: inherit;
            color: var(--text-dark);
            background: var(--bg-white);
            transition: border-color 0.2s;
        }

        input:focus, textarea:focus, select:focus {
            border-color: var(--primary);
        }

        textarea { min-height: 120px; resize: vertical; }

        .form-note {
            font-size: 0.85em;
            color: var(--text-muted);
            margin-top: 8px;
        }

        .button-group {
            display: flex;
            gap: 15px;
            margin-top: 24px;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            text-align: center;
            transition: background 0.2s, border-color 0.2s;
        }

        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: var(--primary-dark); }

        .btn-secondary {
            background: var(--bg-light);
            color: var(--text-dark);
            border: 2px solid var(--border);
        }
        .btn-secondary:hover { background: var(--bg-white); border-color: var(--primary); }

        @media (max-width: 768px) {
            .button-group { flex-direction: column; }
        }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <h1>Feedback</h1>
            <p>Spotted a problem, or have an idea? Let me know.</p>
        </div>
    </header>

    <div class="container">
        <a href="index.html" class="back-link">Back to main site</a>

        <main class="form-container">
            <form id="feedbackForm">
                <div class="form-group">
                    <label for="type">Type of feedback:</label>
                    <select id="type" name="type" required>
                        <option value="">Select an option</option>
                        <option value="bug">Bug report</option>
                        <option value="feature">Feature request</option>
                        <option value="general">General feedback</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="title">Title:</label>
                    <input type="text" id="title" name="title" required>
                </div>

                <div class="form-group">
                    <label for="description">Description:</label>
                    <textarea id="description" name="description" placeholder="What happened, or what would help?" required></textarea>
                </div>

                <p class="form-note">Submitting opens a pre-filled GitHub issue in a new tab. Nothing is collected here.</p>

                <div class="button-group">
                    <button type="submit" class="btn btn-primary">Submit feedback</button>
                    <a href="index.html" class="btn btn-secondary">Cancel</a>
                </div>
            </form>
        </main>
    </div>

    <script>
        // Check URL parameters for pre-selecting type
        const urlParams = new URLSearchParams(window.location.search);
        const typeParam = urlParams.get('type');

        if (typeParam === 'bug') {
            document.getElementById('type').value = 'bug';
        } else if (typeParam === 'feature') {
            document.getElementById('type').value = 'feature';
        }

        document.getElementById('feedbackForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const formData = new FormData(this);
            const data = Object.fromEntries(formData);

            let issueBody = '';

            if (data.type === 'bug') {
                issueBody = `**Describe the bug**
${data.description}

**Additional context**
Submitted via website feedback form`;
            } else if (data.type === 'feature') {
                issueBody = `**Is your feature request related to a problem? Please describe.**
${data.description}

**Additional context**
Submitted via website feedback form`;
            } else {
                issueBody = `**General Feedback**
${data.description}

**Additional context**
Submitted via website feedback form`;
            }

            let githubUrl = 'https://github.com/Julian88Tex/icantaffordatherapist/issues/new?';

            if (data.type === 'bug') {
                githubUrl += 'template=bug_report.md&';
            } else if (data.type === 'feature') {
                githubUrl += 'template=feature_request.md&';
            }

            githubUrl += `title=${encodeURIComponent(data.title)}&body=${encodeURIComponent(issueBody)}`;

            const submitBtn = document.querySelector('.btn-primary');
            const originalText = submitBtn.textContent;
            submitBtn.textContent = 'Opening GitHub...';
            submitBtn.disabled = true;

            setTimeout(() => {
                window.open(githubUrl, '_blank', 'noopener');
                submitBtn.textContent = originalText;
                submitBtn.disabled = false;
            }, 1000);
        });
    </script>
</body>
</html>
